# Orquestração da aplicação com Docker Compose.
#   Deploy:  ./scripts/deploy.sh <tag>
#   Local:   docker compose up -d --build
services:
  api:
    image: ${IMAGE:-ghcr.io/brunopssos/devops_fase1}:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${IMAGE_TAG:-dev}
    container_name: task-api
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
