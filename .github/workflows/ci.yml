name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Evita dois deploys ao mesmo tempo na mesma branch
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI
  build-e-testes:
    name: Lint e testes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependências
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Testes automatizados
        run: npm test

      - name: Publicar relatório de cobertura
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/

  seguranca-dependencias:
    name: Segurança (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Gerar lockfile (sem instalar pacotes)
        run: npm install --package-lock-only --ignore-scripts
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-e-testes
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t devops-fase1-api:${{ github.sha }} .

  terraform-validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Verificar formatação
        run: terraform fmt -check -recursive
      - name: Init (sem backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  # ---------------------------------------------------------------- CD
  publicar-imagem:
    name: CD - Publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: [build-e-testes, seguranca-dependencias, docker-build, terraform-validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo, exigido pelo GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: CD - Deploy com Docker Compose
    runs-on: ubuntu-latest
    needs: publicar-imagem
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: producao
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (pull, up, health check e rollback)
        run: bash scripts/deploy.sh "${{ github.sha }}"

      - name: Smoke test pós-deploy
        run: bash scripts/smoke-test.sh http://127.0.0.1:3000

      - name: Logs do contêiner
        if: always()
        run: IMAGE_TAG="${{ github.sha }}" docker compose logs --tail=30 api || true

      - name: Encerrar ambiente do runner
        if: always()
        run: IMAGE_TAG="${{ github.sha }}" docker compose down || true
